version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bitbite_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: bitbite_redis
    ports:
      - "6379:6379"

  backend:
    build: 
      context: ./backend
    container_name: bitbite_backend
    restart: always
    
    depends_on:
      - db
      - redis

    environment:
      TZ: Asia/Seoul
      DB_HOST: db 
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY} 
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SERVER: smtp.gmail.com 
      MAIL_FROM_NAME: BitBite
    
    env_file:
      - .env

    ports:
      - "8000:8000"
      
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: bitbite_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:8080" 
    volumes:
      - ./frontend:/app

  scheduler:
    build:
      context: ./backend
    container_name: bitbite_scheduler
    restart: always
    depends_on:
      - db 
      - redis
    environment:
      PYTHONUNBUFFERED: 1
      TZ: Asia/Seoul
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER} 
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SERVER: smtp.gmail.com
      MAIL_FROM_NAME: BitBite
    
    command: /usr/local/bin/python /app/scheduler_runner.py

    volumes:
      - ./backend:/app

volumes:
  postgres_data: