kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
    - containerPort: 30080
      hostPort: 30080
      protocol: TCP
      listenAddress: "0.0.0.0"
    - containerPort: 30800
      hostPort: 30800
      protocol: TCP
      listenAddress: "0.0.0.0"
  - role: worker
  - role: worker