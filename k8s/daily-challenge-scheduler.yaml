apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-challenge-scheduler
  labels:
    app: scheduler
    job: daily
spec:
  schedule: "0 12 20 * 1-5"
  timeZone: "Asia/Seoul"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: daily-job
              image: lolry0207/bit-bite_backend:fix
              imagePullPolicy: Always
              args: ["python", "/app/scheduler_runner.py", "daily-challenge"]
              envFrom:
                - secretRef:
                    name: bit-bite-secrets
              env:
                - name: BACKEND_API_URL
                  value: "http://backend-service:8000"
                - name: TZ
                  value: "Asia/Seoul"
                - name: DB_HOST
                  value: postgres-service
                - name: DB_PORT
                  value: "5432"
                - name: REDIS_URL
                  value: "redis://bitbite-redis-service:6379"