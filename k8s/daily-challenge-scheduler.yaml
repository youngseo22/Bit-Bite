apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-challenge-scheduler
  labels:
    app: scheduler
    job: daily
spec:
  schedule: "0 8 * * 1-5"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: daily-job
              image: lolry0207/bit-bite_scheduler:develop
              args: ["python", "/scheduler_main.py", "daily-challenge"]
              envFrom:
                - secretRef:
                    name: bit-bite-secrets
              env:
                - name: TZ
                  value: "Asia/Seoul"
                - name: DB_HOST
                  value: postgres-service
                - name: DB_PORT
                  value: "5432"
                - name: REDIS_URL
                  value: "redis://bitbite-redis-service:6379"