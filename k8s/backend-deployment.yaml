apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: lolry0207/bit-bite_backend:fix
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bit-bite-config
            - secretRef:
                name: bit-bite-secrets
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "sleep 20"]