apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: lolry0207/bit-bite_backend:fix
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: bit-bite-secrets
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "sleep 20"]
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bit-bite-secrets
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bit-bite-secrets
                  key: DB_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: bit-bite-secrets
                  key: DB_NAME

            - name: DB_HOST
              value: postgres-service

            - name: DB_PORT
              value: "5432"
            - name: REDIS_URL
              value: "redis://bitbite-redis-service:6379"