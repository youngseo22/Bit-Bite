apiVersion: batch/v1
kind: CronJob
metadata:
  name: monthly-cleanup-scheduler
  labels:
    app: scheduler
    job: monthly
spec:
  schedule: "0 1 1 * *"
  timeZone: "Asia/Seoul"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup-job
              image: jiwonniddaaa/bit-bite_backend:fix-3
              args: ["python", "/app/scheduler_runner.py", "monthly-cleanup"]
              envFrom:
                - secretRef:
                    name: bit-bite-secrets
              env:
                - name: TZ
                  value: "Asia/Seoul"
                - name: DB_HOST
                  value: postgres-service
                - name: DB_PORT
                  value: "5432"
                - name: REDIS_URL
                  value: "redis://bitbite-redis-service:6379"