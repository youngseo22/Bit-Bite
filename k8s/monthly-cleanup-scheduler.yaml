apiVersion: batch/v1
kind: CronJob
metadata:
  name: monthly-cleanup-scheduler
  labels:
    app: scheduler
    job: monthly
spec:
  schedule: "0 1 1 * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: "Forbid"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup-job
              image: youngseo22/bit-bite_backend:fixv2
              args: ["python", "/app/scheduler_runner.py", "monthly-cleanup"]
              envFrom:
                - configMapRef:
                    name: bit-bite-config
                - secretRef:
                    name: bit-bite-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"